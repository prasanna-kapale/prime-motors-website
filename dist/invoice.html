<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="/logo-black.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invoice — Prime Motors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script type="module" crossorigin src="/assets/invoice-PFwQTxya.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/toast-ofNrhuTp.js">
  <link rel="modulepreload" crossorigin href="/assets/invoiceService-CdsVTMRA.js">
  <link rel="stylesheet" crossorigin href="/assets/toast-BP8glQrk.css">
  <link rel="stylesheet" crossorigin href="/assets/invoice-D5YFlESi.css">
</head>
<body>

<nav class="navbar scrolled">
  <div class="nav-logo" onclick="window.location.href='index.html'">
    <img src="/logo-white.png" alt="Prime Motors" class="navbar-logo-img" style="filter:brightness(1.1)" />
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="nav-back-btn" id="backBtn">← Back to Admin</button>
  </div>
</nav>

<div class="invoice-page">
  <div class="inv-page-header">
    <div>
      <h1>DELIVERY NOTE</h1>
      <p>Cum Intermediator Receipt</p>
    </div>
    <div class="inv-header-btns">
      <button class="btn-ghost" id="printBtn">🖨 Print / Save PDF</button>
    </div>
  </div>

  <div class="invoice-layout">

    <!-- ══ FORM PANEL ══ -->
    <div class="inv-form-panel" id="invFormPanel">

      <!-- Sr No display -->
      <div class="inv-sr-display">
        <span>Sr. No.</span>
        <strong id="srNoDisplay">—</strong>
      </div>

      <!-- Car selector (optional — for inventory cars) -->
      <div class="inv-car-row">
        <label>Select from Inventory (optional)</label>
        <select class="fs" id="inv_car" style="width:100%">
          <option value="">— Manual Entry —</option>
        </select>
      </div>

      <div class="fg-row">
        <div class="fg"><label>Date</label><input class="fi" type="date" id="inv_date"/></div>
        <div class="fg"><label>Time</label><input class="fi" type="time" id="inv_time"/></div>
      </div>

      <h3>Registered Owner</h3>
      <div class="fg"><label>Registered Owner</label><input class="fi" id="inv_reg_owner" placeholder="Full name"/></div>
      <div class="fg-row">
        <div class="fg"><label>S/o</label><input class="fi" id="inv_owner_so" placeholder="Son/Daughter of"/></div>
        <div class="fg"><label>R/o</label><input class="fi" id="inv_owner_ro" placeholder="Resident of"/></div>
      </div>

      <h3>Vehicle Details</h3>
      <div class="fg"><label>Registration No</label><input class="fi" id="inv_reg_no" placeholder="MH-XX-XXXX"/></div>
      <div class="fg"><label>Model</label><input class="fi" id="inv_model" placeholder="Brand + Model"/></div>
      <div class="fg-row">
        <div class="fg"><label>Class of Vehicle</label><input class="fi" id="inv_class" placeholder="4-Wheeler"/></div>
        <div class="fg"><label>Maker's Name</label><input class="fi" id="inv_makers" placeholder="Manufacturer"/></div>
      </div>
      <div class="fg-row">
        <div class="fg"><label>Chassis No</label><input class="fi" id="inv_chassis"/></div>
        <div class="fg"><label>Date of Registration</label><input class="fi" id="inv_doreg" placeholder="DD/MM/YYYY"/></div>
      </div>
      <div class="fg-row">
        <div class="fg"><label>Engine No</label><input class="fi" id="inv_engine"/></div>
        <div class="fg"><label>Type of Body</label><input class="fi" id="inv_bodytype" placeholder="Sedan / SUV…"/></div>
      </div>
      <div class="fg-row">
        <div class="fg"><label>Colour of Vehicle</label><input class="fi" id="inv_colour"/></div>
        <div class="fg"><label>Other</label><input class="fi" id="inv_other"/></div>
      </div>

      <h3>Financials</h3>
      <div class="fg"><label>Total Amount (₹)</label><input class="fi" type="number" id="inv_total" placeholder="e.g. 450000"/></div>
      <div class="fg"><label>Amount in Words</label><input class="fi" id="inv_amount_words" placeholder="Four Lakh Fifty Thousand Only"/></div>
      <div class="fg-row">
        <div class="fg"><label>Advance (₹)</label><input class="fi" type="number" id="inv_advance" placeholder="0"/></div>
        <div class="fg"><label>Balance (₹)</label><input class="fi" type="number" id="inv_balance" placeholder="auto"/></div>
      </div>

      <h3>Payment Received</h3>
      <div class="payment-rows-wrap" id="paymentRows">
        <!-- rendered by JS -->
      </div>
      <div class="inv-paid-display">Total paid: <strong id="inv_paid_display">₹0</strong></div>
      <button class="add-pay-btn" id="addPayRowBtn">+ Add Payment Row</button>

      <h3>Dealer / Through</h3>
      <div class="fg-row">
        <div class="fg"><label>Through Dealer</label><input class="fi" id="inv_dealer"/></div>
        <div class="fg"><label>Shop Name</label><input class="fi" id="inv_shop"/></div>
      </div>
      <div class="fg"><label>Dealer Mobile</label><input class="fi" id="inv_dealer_mob"/></div>

      <h3>Seller Details</h3>
      <div class="fg"><label>Seller Name</label><input class="fi" id="inv_seller_name"/></div>
      <div class="fg-row">
        <div class="fg"><label>S/o</label><input class="fi" id="inv_seller_so"/></div>
        <div class="fg"><label>Mobile</label><input class="fi" id="inv_seller_mob"/></div>
      </div>
      <div class="fg"><label>Address</label><input class="fi" id="inv_seller_addr"/></div>

      <h3>Purchaser Details *</h3>
      <div class="fg"><label>Purchaser Name *</label><input class="fi" id="inv_purchaser_name" placeholder="Required"/></div>
      <div class="fg-row">
        <div class="fg"><label>S/o</label><input class="fi" id="inv_purchaser_so"/></div>
        <div class="fg"><label>Mobile *</label><input class="fi" id="inv_purchaser_mob" placeholder="Required"/></div>
      </div>
      <div class="fg"><label>Address</label><input class="fi" id="inv_purchaser_addr"/></div>

      <!-- ADMIN ONLY -->
      <div class="admin-only-section">
        <h3>⚠ Admin Only (not printed)</h3>
        <div class="fg-row">
          <div class="fg"><label>Brokerage (₹)</label><input class="fi" type="number" id="inv_brokerage"/></div>
          <div class="fg"><label>Broker Name</label><input class="fi" id="inv_broker"/></div>
        </div>
        <div class="fg"><label>Admin Notes</label><input class="fi" id="inv_admin_notes" placeholder="Internal notes…"/></div>
      </div>

      <button class="inv-save-btn" id="saveBtn">💾 SAVE INVOICE</button>
    </div><!-- /inv-form-panel -->

    <!-- ══ PREVIEW PANEL ══ -->
    <div class="inv-preview-panel">
      <h2>Live Preview</h2>
      <div id="printDocWrap"></div>
    </div>

  </div><!-- /invoice-layout -->
</div><!-- /invoice-page -->

</body>
</html>
